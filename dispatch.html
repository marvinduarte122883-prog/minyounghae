<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FiestaFlow Dispatch Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- 1. Load Supabase JS Library First -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- 2. Load Your Client Initialization Second -->
  <script src="supabaseClient.js"></script>

  <!-- 3. PLACE UTILS.JS HERE -->
  <script src="utils.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- TOP NAVIGATION -->
  <header class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-50">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-2">
        <span class="font-black text-amber-400 text-lg">FiestaFlow Central</span>
        <span class="bg-blue-900/80 text-blue-300 text-xs px-2 py-0.5 rounded-full border border-blue-600">Dispatch Panel</span>
      </div>
      <a href="mobile.html" class="text-xs bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-lg text-slate-300 transition">Switch to Mobile View →</a>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="flex-1 p-6 max-w-4xl mx-auto w-full space-y-6">
    
    <div class="bg-slate-800 p-5 rounded-xl border border-slate-700">
      <h1 class="text-xl font-bold text-white">Route Dispatch & Assignments</h1>
      <p class="text-xs text-slate-400 mt-1">Assign daily delivery stops to active field drivers.</p>
    </div>

    <!-- Dispatch Assignment Form -->
    <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 space-y-4">
      <h3 class="text-sm font-semibold text-amber-400 uppercase tracking-wider">New Stop Assignment</h3>
      
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs text-slate-400 mb-1">Stop / Business Name</label>
          <input type="text" id="stopNameInput" placeholder="e.g., Metro Retail Store" class="w-full bg-slate-700 text-white text-sm p-2.5 rounded-lg border border-slate-600 focus:outline-none focus:border-amber-400">
        </div>

        <div>
          <label class="block text-xs text-slate-400 mb-1">Delivery Address</label>
          <input type="text" id="stopAddressInput" placeholder="e.g., Zone 4, Main Highway, CDO" class="w-full bg-slate-700 text-white text-sm p-2.5 rounded-lg border border-slate-600 focus:outline-none focus:border-amber-400">
        </div>
      </div>

      <div>
        <label class="block text-xs text-slate-400 mb-1">Select Active Driver</label>
        <select id="dispatchDriverSelect" class="w-full bg-slate-700 text-white text-sm p-2.5 rounded-lg border border-slate-600 focus:outline-none focus:border-amber-400">
          <option value="">Loading active drivers...</option>
        </select>
      </div>

      <button onclick="assignRouteToDriver()" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-3 rounded-xl shadow-lg transition active:scale-[0.98]">
        Confirm Route Assignment
      </button>
    </div>

  </main>

  <!-- DISPATCH SCRIPT LOGIC -->
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await loadDriverDropdown();
    });

    async function loadDriverDropdown() {
      const selectEl = document.getElementById('dispatchDriverSelect');
      if (!selectEl) return;

      try {
        const { data, error } = await supabase
          .from('profiles')
          .select('id, email, full_name')
          .eq('role', 'driver');

        if (error) throw error;

        if (!data || data.length === 0) {
          selectEl.innerHTML = `<option value="">No active drivers found</option>`;
          return;
        }

        selectEl.innerHTML = `<option value="">-- Choose a Driver --</option>` + data.map(driver => `
          <option value="${driver.id}">${driver.full_name || driver.email}</option>
        `).join('');

      } catch (err) {
        console.error("Error loading drivers:", err);
        selectEl.innerHTML = `<option value="">Failed to load drivers</option>`;
      }
    }

    async function assignRouteToDriver() {
      const driverId = document.getElementById('dispatchDriverSelect').value;
      const stopName = document.getElementById('stopNameInput').value.trim();
      const address = document.getElementById('stopAddressInput').value.trim();

      if (!driverId) {
        alert("Please select a driver.");
        return;
      }
      if (!stopName) {
        alert("Please enter a stop or business name.");
        return;
      }

      const routeAssignment = {
        driver_id: driverId,
        stop_name: stopName,
        address: address || 'No address specified',
        status: 'PENDING',
        created_at: new Date().toISOString()
      };

      try {
        const { error } = await supabase
          .from('assigned_routes')
          .insert([routeAssignment]);

        if (error) throw error;

        alert("✅ Route successfully assigned! It will now appear on the driver's mobile checklist.");
        document.getElementById('stopNameInput').value = '';
        document.getElementById('stopAddressInput').value = '';
        document.getElementById('dispatchDriverSelect').value = '';

      } catch (err) {
        console.error("Error assigning route:", err);
        alert("Failed to assign route: " + err.message);
      }
    }
  </script>
</body>
</html>
