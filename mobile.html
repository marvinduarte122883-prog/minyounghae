<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FiestaFlow Mobile Field Apps</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="supabaseClient.js"></script>

  <script src="utils.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

  <header class="bg-slate-800 border-b border-slate-700 p-3 sticky top-0 z-50">
    <div class="max-w-md mx-auto flex justify-between items-center">
      
      <div class="flex items-center gap-2">
        <span class="font-black text-amber-400 text-lg">FiestaFlow</span>
        <span id="syncStatus" class="bg-emerald-900/80 text-emerald-300 text-xs px-2 py-0.5 rounded-full border border-emerald-600">Online</span>
      </div>

      <div class="flex items-center gap-2">
        <div class="flex bg-slate-900 p-1 rounded-lg border border-slate-700">
          <button id="btnTabDriver" onclick="switchTab('driver')" class="px-2.5 py-1 text-xs font-semibold rounded-md bg-amber-500 text-slate-950 transition-all">Driver</button>
          <button id="btnTabSales" onclick="switchTab('salesman')" class="px-2.5 py-1 text-xs font-semibold rounded-md text-slate-400 hover:text-slate-200 transition-all">Salesman</button>
        </div>

        <div id="userBadge" class="hidden items-center gap-1.5 bg-slate-900 border border-slate-700 px-2 py-1 rounded-lg text-xs text-slate-300">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          <span id="userEmail" class="max-w-[90px] truncate font-medium">Loading...</span>
        </div>

        <button onclick="handleLogout()" title="Log out" class="bg-slate-900 hover:bg-slate-700 text-slate-300 hover:text-red-400 border border-slate-700 p-1.5 rounded-lg transition active:scale-95 flex items-center justify-center">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
          </svg>
        </button>
      </div>

    </div>
  </header>

  <main class="flex-1 p-4 max-w-md mx-auto w-full">

    <section id="driverApp" class="space-y-4">
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 mb-6">
        <h2 class="text-sm font-bold text-amber-400 uppercase tracking-wider mb-3">Today's Assigned Stops</h2>
        <div id="driverTaskList" class="space-y-3">
          <p class="text-xs text-slate-500">Loading your route tasks...</p>
        </div>
      </div>

      <div id="activeStopContainer" class="hidden space-y-4">
        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 flex justify-between items-center">
          <div>
            <span id="activeStopBadge" class="text-xs font-bold text-amber-400 uppercase tracking-wider">Assigned Stop</span>
            <h2 id="activeStopTitle" class="text-lg font-bold text-white">Select a Stop</h2>
          </div>
          <button onclick="closeActiveStop()" class="text-xs bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-lg text-slate-300">← Back to List</button>
        </div>

        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-3">
          <h3 class="text-sm font-semibold text-slate-300 border-b border-slate-700 pb-2">Inventory Handover</h3>
          
          <div class="flex justify-between items-center">
            <label for="driverFilledQty" class="text-sm text-slate-300">Filled Cylinders Delivered</label>
            <input type="number" id="driverFilledQty" value="10" min="0" class="w-20 bg-slate-700 text-amber-400 text-center font-bold text-lg py-1.5 rounded-lg border border-slate-600 focus:outline-none focus:border-amber-400">
          </div>

          <div class="flex justify-between items-center">
            <label for="driverEmptyQty" class="text-sm text-slate-300">Empty Cylinders Collected</label>
            <input type="number" id="driverEmptyQty" value="10" min="0" class="w-20 bg-slate-700 text-amber-400 text-center font-bold text-lg py-1.5 rounded-lg border border-slate-600 focus:outline-none focus:border-amber-400">
          </div>
        </div>

        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-2.5">
          <h3 class="text-sm font-semibold text-slate-300 border-b border-slate-700 pb-2">Required Proofs</h3>
          
          <input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden" onchange="handleFileUpload(event)">

          <button id="btnCapturePhoto" onclick="triggerCamera()" class="w-full bg-slate-700 hover:bg-slate-600 py-2.5 px-3 rounded-lg flex items-center justify-between text-xs font-medium text-slate-200 transition">
            <span>📷 Capture Delivery Photo</span>
            <span id="badgePhoto" class="text-slate-400 text-[10px]">Pending</span>
          </button>

          <button onclick="mockAction('Recipient Signature Captured')" class="w-full bg-slate-700 hover:bg-slate-600 py-2.5 px-3 rounded-lg flex items-center justify-between text-xs font-medium text-slate-200 transition">
            <span>✍️ Recipient Signature</span>
            <span id="badgeSig" class="text-slate-400 text-[10px]">Pending</span>
          </button>

          <button onclick="mockAction('Payment Attachment Added')" class="w-full bg-slate-700 hover:bg-slate-600 py-2.5 px-3 rounded-lg flex items-center justify-between text-xs font-medium text-slate-200 transition">
            <span>🧾 Attach GCash / Cheque Proof</span>
            <span id="badgeProof" class="text-slate-400 text-[10px]">Optional</span>
          </button>
        </div>

        <button onclick="submitDriverDelivery()" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-3.5 rounded-xl shadow-lg transition active:scale-[0.98]">
          Complete Delivery & Save Stop
        </button>
      </div>
    </section>


    <section id="salesmanApp" class="space-y-4 hidden">
      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
        <span class="text-xs font-bold text-amber-400 uppercase tracking-wider">Field Onboarding</span>
        <h2 class="text-lg font-bold text-white">New Franchisee Registration</h2>
        <p class="text-xs text-slate-400 mt-1">Truck-sale registrations will remain PENDING until verified by Central Office.</p>
      </div>

      <form id="onboardForm" onsubmit="submitSalesmanOnboarding(event)" class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-3">
        <div>
          <label class="block text-xs text-slate-400 mb-1">Business Name</label>
          <input type="text" id="bizName" required placeholder="e.g., CDO Gas Hub" class="w-full bg-slate-700 text-white text-sm p-2.5 rounded-lg border border-slate-600 focus:outline-none focus:border-amber-400">
        </div>

        <div>
          <label class="block text-xs text-slate-400 mb-1">Contact Person & Phone</label>
          <input type="text" id="contactPerson" required placeholder="e.g., Juan Dela Cruz (0917...)" class="w-full bg-slate-700 text-white text-sm p-2.5 rounded-lg border border-slate-600 focus:outline-none focus:border-amber-400">
        </div>

        <div>
          <label class="block text-xs text-slate-400 mb-1">Franchise Package Tier</label>
          <select id="pkgTier" class="w-full bg-slate-700 text-white text-sm p-2.5 rounded-lg border border-slate-600 focus:outline-none focus:border-amber-400">
            <option value="pkg_bronze">Package Tier A (₱1.00 Refill Discount)</option>
            <option value="pkg_silver">Package Tier B (₱2.00 Refill Discount)</option>
            <option value="pkg_gold">Package Tier C (₱3.00 Refill Discount)</option>
          </select>
        </div>

        <div>
          <label class="block text-xs text-slate-400 mb-1">Initial Inventory Claimed (Crates)</label>
          <input type="number" id="initialCrates" min="1" value="10" class="w-full bg-slate-700 text-white text-sm p-2.5 rounded-lg border border-slate-600 focus:outline-none focus:border-amber-400">
        </div>

        <button type="submit" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-3.5 rounded-xl shadow-lg transition active:scale-[0.98] mt-2">
          Submit Pending Account & Issue Stock
        </button>
      </form>
    </section>

  </main>

  <script>
    let currentPhotoUrl = null;
    let currentUserId = null;
    let selectedStop = null;

    // Session Check Guard & Session Badge Initialization on Page Load
    document.addEventListener('DOMContentLoaded', async () => {
      if (typeof supabase !== 'undefined') {
        const { data: { session }, error } = await supabase.auth.getSession();
        
        if (error || !session) {
          console.warn('Unauthorized access. Redirecting to login...');
          window.location.href = 'login.html';
          return;
        }

        currentUserId = session.user.id;

        // Display user email in header badge
        const userBadge = document.getElementById('userBadge');
        const userEmail = document.getElementById('userEmail');
        if (userEmail && session.user) {
          userEmail.textContent = session.user.email;
          userBadge.classList.remove('hidden');
          userBadge.classList.add('flex');
        }

        // Fetch assigned route checklist tasks
        await fetchDriverTasks();

        // Trigger automatic sync if device is online on load
        if (navigator.onLine) {
          await syncOfflineQueue();
        }
      } else {
        console.error('Supabase client failed to initialize. Check script imports.');
      }
    });

    // Fetch assigned routes for the logged-in driver (filtered accurately by driver_id and PENDING status)
    async function fetchDriverTasks() {
      const taskList = document.getElementById('driverTaskList');
      if (!taskList) return;

      try {
        const { data, error } = await supabase
          .from('assigned_routes')
          .select('*')
          .eq('driver_id', currentUserId)
          .eq('status', 'PENDING')
          .order('created_at', { ascending: false });

        if (error) throw error;

        if (!data || data.length === 0) {
          taskList.innerHTML = `<p class="text-xs text-slate-500">No pending delivery stops found.</p>`;
          return;
        }

        taskList.innerHTML = data.map(stop => `
          <div class="bg-slate-800 border border-slate-700 p-3.5 rounded-xl flex items-center justify-between transition hover:border-amber-500/50">
            <div>
              <p class="text-xs font-bold text-amber-400">${stop.stop_name}</p>
              <p class="text-xs text-slate-300 mt-0.5">${stop.address || 'No address specified'}</p>
              <span class="inline-block mt-2 text-[10px] bg-slate-700 text-slate-300 px-2 py-0.5 rounded uppercase font-semibold">${stop.status || 'PENDING'}</span>
            </div>
            <button onclick='selectStop(${JSON.stringify(stop)})' class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs px-3 py-2 rounded-lg transition shadow">
              Deliver →
            </button>
          </div>
        `).join('');

      } catch (err) {
        console.error("Error loading assigned routes:", err);
        taskList.innerHTML = `<p class="text-xs text-red-400">Failed to load route tasks.</p>`;
      }
    }

    function selectStop(stop) {
      selectedStop = stop;
      document.getElementById('driverTaskList').closest('div').classList.add('hidden');
      document.getElementById('activeStopContainer').classList.remove('hidden');
      document.getElementById('activeStopTitle').textContent = stop.stop_name;
      document.getElementById('activeStopBadge').textContent = `Stop ID: ${stop.id.substring(0, 6)}...`;
    }

    function closeActiveStop() {
      selectedStop = null;
      document.getElementById('activeStopContainer').classList.add('hidden');
      document.getElementById('driverTaskList').closest('div').classList.remove('hidden');
      fetchDriverTasks();
    }

    // Dedicated Logout Handler
    async function handleLogout() {
      const confirmed = confirm("Are you sure you want to log out of FiestaFlow?");
      if (!confirmed) return;

      try {
        await supabase.auth.signOut();
      } catch (err) {
        console.error("Logout error:", err);
      } finally {
        window.location.href = 'login.html';
      }
    }

    // Tab Switching Logic
    function switchTab(tab) {
      const driverSec = document.getElementById('driverApp');
      const salesSec = document.getElementById('salesmanApp');
      const btnDriver = document.getElementById('btnTabDriver');
      const btnSales = document.getElementById('btnTabSales');

      if (tab === 'driver') {
        driverSec.classList.remove('hidden');
        salesSec.classList.add('hidden');
        btnDriver.className = "px-2.5 py-1 text-xs font-semibold rounded-md bg-amber-500 text-slate-950 transition-all";
        btnSales.className = "px-2.5 py-1 text-xs font-semibold rounded-md text-slate-400 hover:text-slate-200 transition-all";
      } else {
        salesSec.classList.remove('hidden');
        driverSec.classList.add('hidden');
        btnSales.className = "px-2.5 py-1 text-xs font-semibold rounded-md bg-amber-500 text-slate-950 transition-all";
        btnDriver.className = "px-2.5 py-1 text-xs font-semibold rounded-md text-slate-400 hover:text-slate-200 transition-all";
      }
    }

    // Camera Trigger & Supabase Storage Upload
    function triggerCamera() {
      document.getElementById('cameraInput').click();
    }

    async function handleFileUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      if (typeof supabase === 'undefined' || !supabase.storage) {
        alert("Error: Supabase client is not initialized.");
        return;
      }

      const badge = document.getElementById('badgePhoto');
      badge.textContent = "Uploading...";
      badge.className = "text-amber-400 text-[10px]";

      try {
        const fileExt = file.name.split('.').pop();
        const fileName = `delivery_${Date.now()}_${Math.random().toString(36).substring(2, 7)}.${fileExt}`;
        const filePath = `proofs/${fileName}`;

        const { data, error } = await supabase.storage
          .from('proof-attachments')
          .upload(filePath, file);

        if (error) throw error;

        const { data: publicUrlData } = supabase.storage
          .from('proof-attachments')
          .getPublicUrl(filePath);

        currentPhotoUrl = publicUrlData.publicUrl;

        badge.textContent = "✓ Uploaded";
        badge.className = "text-emerald-400 font-bold text-[10px]";
        alert("Delivery photo successfully uploaded to Supabase Storage!");
      } catch (err) {
        console.error("Storage upload error:", err);
        badge.textContent = "Failed";
        badge.className = "text-red-400 text-[10px]";
        alert("Upload failed: " + err.message);
      }
    }

    // Mock Evidence Captures
    function mockAction(type) {
      alert(type + ' successfully!');
    }

    // Async Submit Driver Delivery Logic connected to Supabase DB
    async function submitDriverDelivery() {
      const filled = parseInt(document.getElementById('driverFilledQty').value) || 0;
      const empty = parseInt(document.getElementById('driverEmptyQty').value) || 0;

      if (!currentPhotoUrl) {
        if (!confirm("No delivery photo uploaded. Do you want to submit anyway?")) {
          return;
        }
      }

      const deliveryData = {
        type: 'driver_delivery',
        stop_name: selectedStop ? selectedStop.stop_name : 'Assigned Stop',
        filled_delivered: filled,
        empty_collected: empty,
        photo_url: currentPhotoUrl,
        status: 'COMPLETED',
        created_at: new Date().toISOString()
      };

      try {
        const { type, ...dbData } = deliveryData;
        const { data, error } = await supabase
          .from('deliveries')
          .insert([dbData]);

        if (error) throw error;

        // Optionally update assigned route status to completed if selectedStop exists
        if (selectedStop) {
          await supabase
            .from('assigned_routes')
            .update({ status: 'COMPLETED' })
            .eq('id', selectedStop.id);
        }

        alert("✅ Delivery recorded and saved to Supabase successfully!");
        
        currentPhotoUrl = null;
        document.getElementById('badgePhoto').textContent = "Pending";
        document.getElementById('badgePhoto').className = "text-slate-400 text-[10px]";

        closeActiveStop();

      } catch (err) {
        console.error("Error saving delivery, saving offline:", err);
        saveOfflineRecord(deliveryData);
      }
    }

    // Async Submit Salesman Onboarding connected directly to Supabase
    async function submitSalesmanOnboarding(e) {
      e.preventDefault();

      const submitBtn = e.target.querySelector('button[type="submit"]');
      const originalBtnText = submitBtn.textContent;
      
      submitBtn.disabled = true;
      submitBtn.textContent = "Submitting to Supabase...";

      const record = {
        type: 'salesman_account_onboard',
        business_name: document.getElementById('bizName').value.trim(),
        contact_person: document.getElementById('contactPerson').value.trim(),
        package_tier: document.getElementById('pkgTier').value,
        initial_crates: parseInt(document.getElementById('initialCrates').value) || 0,
        status: 'PENDING_CENTRAL_APPROVAL',
        created_at: new Date().toISOString()
      };

      try {
        const { type, ...dbData } = record;
        const { data, error } = await supabase
          .from('onboardings')
          .insert([dbData]);

        if (error) throw error;

        alert("✅ New franchisee account submitted to Supabase! Status: PENDING_CENTRAL_APPROVAL");
        document.getElementById('onboardForm').reset();

      } catch (err) {
        console.error("Error submitting onboarding form, saving offline:", err);
        saveOfflineRecord(record);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = originalBtnText;
      }
    }

    // Offline Storage Handler via localStorage
    function saveOfflineRecord(data) {
      const queue = JSON.parse(localStorage.getItem('fiesta_offline_queue') || '[]');
      
      queue.push({
        ...data,
        offline_id: crypto.randomUUID(),
        queued_at: new Date().toISOString()
      });
      
      localStorage.setItem('fiesta_offline_queue', JSON.stringify(queue));
      
      alert(`⚠️ Saved locally (Offline Mode).\nRecord queued for sync when connection is restored.`);
      updateNetworkStatus();
    }

    // Sync Handler to Process Queued Items
    async function syncOfflineQueue() {
      const queue = JSON.parse(localStorage.getItem('fiesta_offline_queue') || '[]');
      if (queue.length === 0) return;

      console.log(`Attempting to sync ${queue.length} offline records...`);
      const remainingQueue = [];

      for (const item of queue) {
        try {
          if (item.type === 'salesman_account_onboard') {
            const { type, offline_id, queued_at, ...record } = item;
            const { error } = await supabase.from('onboardings').insert([record]);
            if (error) throw error;
          } else {
            const { type, offline_id, queued_at, ...record } = item;
            const { error } = await supabase.from('deliveries').insert([record]);
            if (error) throw error;
          }
        } catch (err) {
          console.error("Failed to sync record, holding in queue:", item, err);
          remainingQueue.push(item);
        }
      }

      localStorage.setItem('fiesta_offline_queue', JSON.stringify(remainingQueue));
      
      const syncedCount = queue.length - remainingQueue.length;
      if (syncedCount > 0) {
        alert(`✅ Automatically synced ${syncedCount} queued record(s) to Supabase!`);
      }
      updateNetworkStatus();
    }

    // Network Status Indicator & Listener Setup
    window.addEventListener('online', async () => {
      updateNetworkStatus();
      await syncOfflineQueue();
    });
    window.addEventListener('offline', updateNetworkStatus);

    function updateNetworkStatus() {
      const badge = document.getElementById('syncStatus');
      const queue = JSON.parse(localStorage.getItem('fiesta_offline_queue') || '[]');
      const queueCount = queue.length;

      if (navigator.onLine) {
        if (queueCount > 0) {
          badge.textContent = `Online (${queueCount} Queued)`;
          badge.className = "bg-amber-900/80 text-amber-300 text-xs px-2 py-0.5 rounded-full border border-amber-600";
        } else {
          badge.textContent = "Online";
          badge.className = "bg-emerald-900/80 text-emerald-300 text-xs px-2 py-0.5 rounded-full border border-emerald-600";
        }
      } else {
        badge.textContent = `Offline (${queueCount} Queued)`;
        badge.className = "bg-rose-900/80 text-rose-300 text-xs px-2 py-0.5 rounded-full border border-rose-600";
      }
    }
  </script>
</body>
</html>
