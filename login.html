<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FiestaFlow - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="supabaseClient.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 font-sans">

  <div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl w-full max-w-md space-y-6 shadow-2xl">
    <div class="text-center space-y-1">
      <h1 class="text-2xl font-black text-amber-400 tracking-wider">FiestaFlow OS</h1>
      <p class="text-xs text-slate-400">Sign in to access your assigned operational portal</p>
    </div>

    <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">Email Address</label>
        <input type="email" id="email" required placeholder="cashier@fiestaflow.ph" class="w-full bg-slate-800 border border-slate-700 text-white text-sm p-3 rounded-xl focus:outline-none focus:border-amber-400">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">Password</label>
        <input type="password" id="password" required placeholder="••••••••" class="w-full bg-slate-800 border border-slate-700 text-white text-sm p-3 rounded-xl focus:outline-none focus:border-amber-400">
      </div>

      <button type="submit" id="btnLogin" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-3.5 rounded-xl shadow-lg transition active:scale-[0.98] mt-2">
        Sign In
      </button>
    </form>

    <div id="authStatus" class="text-center text-xs text-amber-400 hidden">
      Authenticating user session...
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (typeof supabase === 'undefined') {
        console.error('Supabase client not initialized.');
        return;
      }
      
      // If already logged in, check role and route accordingly
      const { data: { session } } = await supabase.auth.getSession();
      if (session) {
        await redirectBasedOnRole(session.user.id);
      }
    });

    async function handleLogin(e) {
      e.preventDefault();
      
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('btnLogin');
      const status = document.getElementById('authStatus');

      // Update UI feedback states
      btn.disabled = true;
      btn.textContent = "Signing in...";
      status.classList.remove('hidden');
      status.textContent = 'Authenticating user session...';
      status.className = "text-center text-xs text-amber-400";

      try {
        // 1. Authenticate with Supabase Auth using global client initialized in supabaseClient.js
        const { data: authData, error: authErr } = await supabase.auth.signInWithPassword({
          email: email,
          password: password
        });

        if (authErr) throw authErr;

        // 2. Fetch User Profile & Role metadata
        const { data: profile, error: profileErr } = await supabase
          .from('user_profiles')
          .select('role')
          .eq('id', authData.user.id)
          .single();

        // If no custom profile or error fetching profile, fallback to mobile.html
        if (profileErr || !profile) {
          console.warn("User profile/role not found. Defaulting to driversdashboard.html redirect.");
          status.textContent = 'Login successful! Redirecting to field portal...';
          status.className = "text-center text-xs text-emerald-400";
          setTimeout(() => {
            window.location.href = 'driversdashboard.html';
          }, 600);
          return;
        }

        // 3. Route user according to assigned role
        status.textContent = 'Login successful! Redirecting...';
        status.className = "text-center text-xs text-emerald-400";

        setTimeout(() => {
          switch (profile.role) {
            case 'driver':
            case 'salesman':
              window.location.href = 'driversdashboard.html';
              break;
            case 'central_admin':
            case 'manager':
              window.location.href = 'dashboard.html';
              break;
            case 'cashier':
            default:
              window.location.href = 'index.html';
              break;
          }
        }, 600);

      } catch (err) {
        console.error("Authentication error:", err);
        status.textContent = 'Login Failed: ' + err.message;
        status.className = "text-center text-xs text-red-400";
      } finally {
        btn.disabled = false;
        btn.textContent = "Sign In";
      }
    }
  </script>
</body>
</html>
